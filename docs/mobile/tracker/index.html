<title>Poker Enfermos Móvil</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: una columna de tablero, resumen arriba, detalle abajo. Mesa de lounge noir: fieltro oscuro, latón, cobre. */
:root{
  --bg:#1F1410; --panel:#2A1B15; --panel-2:#33221A; --line:#3C2219;
  --fg:#F3E6C5; --muted:#D7C59A; --dim:#9C8A68;
  --gold:#E0B66C; --copper:#A9441C;
  --ok:#7FB77E; --warn:#E0B66C; --bad:#E06A55; --info:#8FB3C9;
  --display:"Cinzel",Georgia,serif; --body:"Inter",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1,h2{font-family:var(--display);font-weight:700;letter-spacing:.04em;margin:0;text-wrap:balance}
h1{font-size:clamp(1.6rem,4vw,2.3rem);color:var(--gold)}
h2{font-size:.95rem;text-transform:uppercase;letter-spacing:.22em;color:var(--muted);display:flex;align-items:baseline;gap:10px}
h2 .count{font-family:var(--mono);font-size:.8rem;color:var(--dim);letter-spacing:0}
.lbl{font-family:var(--display);font-size:.7rem;text-transform:uppercase;letter-spacing:.24em;color:var(--copper)}
header{display:flex;flex-direction:column;gap:10px}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--dim);font-size:.85rem}
.meta code{font-family:var(--mono);color:var(--muted)}
.status{font-size:1.05rem;color:var(--fg)}
.progress{display:flex;align-items:center;gap:14px}
.bar{flex:1;height:8px;background:var(--panel-2);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--copper),var(--gold));transition:width .22s ease}
.pct{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--gold);min-width:4ch;text-align:right}

.you{border:1px solid var(--copper);background:linear-gradient(180deg,rgba(169,68,28,.16),rgba(169,68,28,.04));border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.you ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.you li{display:grid;grid-template-columns:20px 1fr;gap:10px;align-items:start}
.you li.done{opacity:.5}
.you li.done b{text-decoration:line-through}
.chk{width:16px;height:16px;border:1.5px solid var(--gold);border-radius:3px;margin-top:3px}
.done .chk{background:var(--gold)}
.you b{font-weight:600}
.you span{display:block;color:var(--muted);font-size:.88rem}
code{font-family:var(--mono);font-size:.85em;background:var(--panel-2);padding:1px 5px;border-radius:3px}

.phases{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px}
.ph{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 8px;display:flex;flex-direction:column;gap:4px;min-width:0;position:relative;overflow:hidden}
.ph::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--line)}
.ph.doing::before{background:var(--gold)} .ph.done::before{background:var(--ok)} .ph.blocked::before{background:var(--bad)}
.ph .id{font-family:var(--mono);font-size:.78rem;color:var(--gold)}
.ph .nm{font-size:.78rem;color:var(--muted);line-height:1.3}
.ph .n{font-family:var(--mono);font-size:.72rem;color:var(--dim);font-variant-numeric:tabular-nums}
@media (max-width:820px){.phases{grid-template-columns:repeat(3,minmax(0,1fr))}}

.agents{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.ag{border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;background:var(--panel)}
.ag .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ag b{font-family:var(--display);font-size:.92rem;letter-spacing:.04em}
.ag .area{color:var(--dim);font-size:.8rem}
.ag .now{color:var(--muted);font-size:.85rem}

.pill{font-family:var(--mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.s-todo,.s-idle{color:var(--dim)} .s-doing{color:var(--gold)} .s-review{color:var(--info)} .s-done{color:var(--ok)} .s-blocked{color:var(--bad)}
.sev-alta,.sev-critica{color:var(--bad)} .sev-media{color:var(--warn)} .sev-baja{color:var(--info)}

.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters button{font:inherit;font-family:var(--mono);font-size:.78rem;background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 11px;cursor:pointer;transition:all .2s ease}
.filters button:hover{border-color:var(--gold);color:var(--fg)}
.filters button[aria-pressed="true"]{background:var(--gold);color:var(--bg);border-color:var(--gold)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{font-family:var(--display);font-weight:500;font-size:.68rem;text-transform:uppercase;letter-spacing:.18em;color:var(--dim);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.mono{font-family:var(--mono);font-size:.8rem;color:var(--gold);white-space:nowrap;font-variant-numeric:tabular-nums}
td .note{display:block;color:var(--dim);font-size:.8rem}
.empty{color:var(--dim);font-size:.9rem;padding:14px;border:1px dashed var(--line);border-radius:8px}
section{display:flex;flex-direction:column;gap:12px;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.two>*{min-width:0}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.err{color:var(--bad)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <span class="lbl">Expo · iOS · Android · Web</span>
    <h1>Poker Enfermos Móvil</h1>
    <div class="status" id="status">Cargando…</div>
    <div class="progress"><div class="bar"><i id="bar" style="width:0"></i></div><span class="pct" id="pct">0%</span></div>
    <div class="meta"><span>Rama <code id="branch">—</code></span><span>Actualizado <span id="updated">—</span></span></div>
  </header>

  <div class="you" id="youBox">
    <h2>Te necesito para</h2>
    <ul id="you"></ul>
  </div>

  <section>
    <h2>Fases</h2>
    <div class="phases" id="phases"></div>
  </section>

  <section>
    <h2>Agentes</h2>
    <div class="agents" id="agents"></div>
  </section>

  <section>
    <h2>Tareas <span class="count" id="taskCount"></span></h2>
    <div class="filters" id="filters" role="group" aria-label="Filtrar por fase"></div>
    <div class="tbl"><table><thead><tr><th>ID</th><th>Tarea</th><th>Agente</th><th>Estado</th></tr></thead><tbody id="tasks"></tbody></table></div>
  </section>

  <section>
    <h2>Problemas <span class="count" id="issueCount"></span></h2>
    <div id="issues"></div>
  </section>

  <div class="two">
    <section>
      <h2>Commits <span class="count" id="commitCount"></span></h2>
      <div id="commits"></div>
    </section>
    <section>
      <h2>Builds <span class="count" id="buildCount"></span></h2>
      <div id="builds"></div>
    </section>
  </div>
</div>

<script>
const STATUS={todo:"pendiente",idle:"en espera",doing:"en curso",review:"en revisión",done:"listo",blocked:"bloqueado"};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const md=s=>esc(s).replace(/`([^`]+)`/g,"<code>$1</code>");
const pill=(s,cls)=>`<span class="pill ${cls||"s-"+s}">${esc(STATUS[s]||s)}</span>`;
let D=null, phaseFilter="all";

function table(rows,cols,empty){
  if(!rows.length) return `<div class="empty">${empty}</div>`;
  return `<div class="tbl"><table><thead><tr>${cols.map(c=>`<th>${c[0]}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td${c[2]?` class="${c[2]}"`:""}>${c[1](r)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}

function renderTasks(){
  const list=D.tasks.filter(t=>phaseFilter==="all"||t.phase===phaseFilter);
  document.getElementById("tasks").innerHTML=list.map(t=>`<tr><td class="mono">${esc(t.id)}<span class="note">${esc(t.phase)}</span></td><td>${md(t.title)}${t.note?`<span class="note">${md(t.note)}</span>`:""}</td><td>${esc(t.owner)}</td><td>${pill(t.status)}</td></tr>`).join("");
  document.querySelectorAll("#filters button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.p===phaseFilter));
}

function render(d){
  D=d;
  const done=d.tasks.filter(t=>t.status==="done").length;
  const pct=d.tasks.length?Math.round(done/d.tasks.length*100):0;
  document.getElementById("status").textContent=d.status;
  document.getElementById("bar").style.width=pct+"%";
  document.getElementById("pct").textContent=pct+"%";
  document.getElementById("branch").textContent=d.branch;
  document.getElementById("updated").textContent=d.updated;

  const you=d.you||[];
  document.getElementById("youBox").hidden=!you.some(y=>!y.done);
  document.getElementById("you").innerHTML=you.map(y=>`<li class="${y.done?"done":""}"><div class="chk"></div><div><b>${md(y.title)}</b><span>${md(y.detail)}</span></div></li>`).join("");

  document.getElementById("phases").innerHTML=d.phases.map(p=>{
    const ts=d.tasks.filter(t=>t.phase===p.id), dn=ts.filter(t=>t.status==="done").length;
    return `<div class="ph ${p.status}" title="${esc(STATUS[p.status])}"><span class="id">${esc(p.id)}</span><span class="nm">${esc(p.name)}</span><span class="n">${dn}/${ts.length}</span></div>`;
  }).join("");

  document.getElementById("agents").innerHTML=d.agents.map(a=>`<div class="ag"><div class="top"><b>${esc(a.name)}</b>${pill(a.status)}</div><span class="area">${esc(a.area)}</span><span class="now">${md(a.now)}</span></div>`).join("");

  document.getElementById("filters").innerHTML=[`<button data-p="all">Todas</button>`,...d.phases.map(p=>`<button data-p="${esc(p.id)}">${esc(p.id)}</button>`)].join("");
  document.querySelectorAll("#filters button").forEach(b=>b.onclick=()=>{phaseFilter=b.dataset.p;renderTasks()});
  document.getElementById("taskCount").textContent=`${done}/${d.tasks.length}`;
  renderTasks();

  const open=d.issues.filter(i=>i.status!=="resuelta").length;
  document.getElementById("issueCount").textContent=`${open} abiertos · ${d.issues.length} total`;
  document.getElementById("issues").innerHTML=table(d.issues,[
    ["ID",i=>esc(i.id),"mono"],
    ["Problema",i=>`${md(i.title)}<span class="note">${md(i.detail)}</span>`],
    ["Gravedad",i=>`<span class="pill sev-${esc(i.severity)}">${esc(i.severity)}</span>`],
    ["Estado",i=>`${esc(i.status)}<span class="note">${esc(i.by)}</span>`]
  ],"Sin problemas reportados.");

  document.getElementById("commitCount").textContent=d.commits.length;
  document.getElementById("commits").innerHTML=table(d.commits,[
    ["SHA",c=>esc(c.sha),"mono"],["Mensaje",c=>`${md(c.msg)}<span class="note">${esc(c.date)} · ${esc(c.agent)}</span>`]
  ],"Todavía no hay commits en la rama.");

  document.getElementById("buildCount").textContent=d.builds.length;
  document.getElementById("builds").innerHTML=table(d.builds,[
    ["Plataforma",b=>`${esc(b.platform)}<span class="note">${esc(b.profile)}</span>`],["Estado",b=>pill(b.status)],["Fecha",b=>esc(b.date)]
  ],"Todavía no hay builds.");
}

fetch("data.json",{cache:"no-store"}).then(r=>r.json()).then(render)
  .catch(()=>{document.getElementById("status").innerHTML='<span class="err">No se pudieron cargar los datos del monitor.</span>'});
</script>
